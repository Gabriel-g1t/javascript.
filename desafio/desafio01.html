<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <h1>Sua Nacionalidade</h1>
    Pais: <input type="text" name="pais" id="ipais">
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res">

    <script>
        function calcular() {
            var tpais = window.document.querySelector('input#ipais')
            var res = window.document.querySelector('div#res')
            var pais = tpais.value

            if (pais == 'brasil') { 
            res.innerHTML += '<p>Você é <strong>Brasileiro</strong></p>'
            } else {
            res.innerHTML = '<p>Você é <strong>Estrangeiro</strong></p>'
            }
        }
    </script>
